services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: test_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /var/lib/postgresql/data # Runs test database in RAM for faster execution
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend_test:
    build:
      context: ./eta_backend
      dockerfile: Dockerfile
      args:
        PYTHON_ENV: test
    working_dir: /app
    command: python -m pytest expenses/tests accounts/tests -q
    environment:
      - PYTHON_ENV=test
      - DEBUG=0
      - SECRET_KEY=django-insecure-test-key-only-for-ci
      - DATABASE_URL=postgres://postgres:postgres@db:5432/test_db
      - REDIS_URL=redis://redis:6379/0
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./eta_backend:/app