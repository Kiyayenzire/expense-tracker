name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: eta-expense-tracker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: eta_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Run backend tests
        working-directory: eta_backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "django-insecure-ci-test-key-for-pytest"
          DEBUG: "False"
        run: |
          python -m pytest expenses/tests accounts/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: eta_frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: eta_frontend
        run: npm test -- --run

      - name: Install Playwright browser
        working-directory: eta_frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: eta_frontend
        run: npm run test:e2e -- --workers=1

      - name: Build frontend
        working-directory: eta_frontend
        run: npm run build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          printf 'REPO_OWNER=%s\n' "${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./eta_backend
          file: ./eta_backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/eta_backend:latest
            ghcr.io/${{ env.REPO_OWNER }}/eta_backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./eta_frontend
          file: ./eta_frontend/Dockerfile
          push: true
          build-args: |
            VITE_SUPPORT_EMAIL=${{ vars.VITE_SUPPORT_EMAIL }}
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/eta_frontend:latest
            ghcr.io/${{ env.REPO_OWNER }}/eta_frontend:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Deploy published images using the server Compose configuration
        uses: appleboy/ssh-action@v1.0.3
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: REGISTRY_USERNAME,REGISTRY_TOKEN,IMAGE_OWNER,IMAGE_TAG
          script: |
            set -eu
            cd /home/deploy/expense-tracker
            printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USERNAME" --password-stdin
            image_owner="$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')"
            override_file="$(mktemp /tmp/eta-compose-override.XXXXXX.yaml)"
            trap 'rm -f "$override_file"' EXIT
            cat > "$override_file" <<EOF
            services:
              migration:
                image: ghcr.io/$image_owner/eta_backend:$IMAGE_TAG
              backend:
                image: ghcr.io/$image_owner/eta_backend:$IMAGE_TAG
              celery_worker:
                image: ghcr.io/$image_owner/eta_backend:$IMAGE_TAG
              celery_beat:
                image: ghcr.io/$image_owner/eta_backend:$IMAGE_TAG
              frontend:
                image: ghcr.io/$image_owner/eta_frontend:$IMAGE_TAG
            EOF
            docker compose -f docker-compose.yml -f "$override_file" --env-file .env config --quiet
            docker compose -f docker-compose.yml -f "$override_file" --env-file .env pull
            docker compose -f docker-compose.yml -f "$override_file" --env-file .env up -d --remove-orphans

      - name: Verify public production routes
        env:
          BASE_URL: https://eta.althech.com
        run: |
          set -euo pipefail
          echo "Waiting for Django backend to complete startup..."

          # Poll the backend API endpoint specifically until Gunicorn is ready
          for i in {1..12}; do
            if curl --fail --silent "$BASE_URL/api/auth/options/" >/dev/null 2>&1; then
              echo "Django backend is online!"
              break
            fi
            echo "Backend API initializing (attempt $i/12)..."
            sleep 5
          done

          echo "--> Step 1/3: Verifying Frontend HTML Title"
          curl --fail --silent --show-error "$BASE_URL/" | grep -qi '<title>Expense Tracker</title>'

          echo "--> Step 2/3: Verifying API Auth Options"
          auth_options="$(curl --fail --silent --show-error "$BASE_URL/api/auth/options/")"
          printf '%s' "$auth_options" | jq -e '
            (.providers.google.configured | type == "boolean") and
            (.providers.apple.configured | type == "boolean")
          ' >/dev/null

          echo "--> Step 3/3: Verifying Custom Admin Route (/etaalthech2026/)"
          admin_page="$(curl --fail --silent --show-error --location "$BASE_URL/etaalthech2026/")"
          printf '%s' "$admin_page" | grep -q 'id_username'

          echo "All production checks passed successfully!"