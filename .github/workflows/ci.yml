name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install backend dependencies
        working-directory: eta_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/test.txt

      - name: Run backend tests
        working-directory: eta_backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "django-insecure-ci-test-key-for-pytest"
          DEBUG: "False"
        run: |
          python -m pytest expenses/tests accounts/tests -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: eta_frontend
        run: npm ci

      - name: Build frontend
        working-directory: eta_frontend
        run: npm run build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set lowercase repository owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./eta_backend
          file: ./eta_backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/eta_backend:latest
            ghcr.io/${{ env.REPO_OWNER }}/eta_backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./eta_frontend
          file: ./eta_frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/eta_frontend:latest
            ghcr.io/${{ env.REPO_OWNER }}/eta_frontend:${{ github.sha }}
