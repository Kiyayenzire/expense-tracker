name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "sqlite:///:memory:"
      SECRET_KEY: "dummy-secret-key-for-testing"
      DEBUG: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: eta_backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Run backend tests
        working-directory: eta_backend
        run: |
          python -m pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: eta_frontend
        run: npm ci

      - name: Build frontend
        working-directory: eta_frontend
        run: npm run build

  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: ./eta_backend
          file: ./eta_backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eta_backend:latest
            ghcr.io/${{ github.repository_owner }}/eta_backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./eta_frontend
          file: ./eta_frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eta_frontend:latest
            ghcr.io/${{ github.repository_owner }}/eta_frontend:${{ github.sha }}
