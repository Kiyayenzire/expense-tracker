services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/kiyayenzire/expense-tracker-backend:latest}
    restart: always
    env_file:
      - ./.env
    volumes:
      - staticfiles:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    image: ${BACKEND_IMAGE:-ghcr.io/kiyayenzire/expense-tracker-backend:latest}
    restart: always
    command: celery -A backend worker --loglevel=info
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_beat:
    image: ${BACKEND_IMAGE:-ghcr.io/kiyayenzire/expense-tracker-backend:latest}
    restart: always
    command: celery -A backend beat --loglevel=info
    env_file:
      - ./.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/kiyayenzire/expense-tracker-frontend:latest}
    restart: always
    depends_on:
      - backend

  webserver:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles:/app/staticfiles:ro
      - media_data:/app/media:ro
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  redis_data:
  staticfiles:
  media_data: