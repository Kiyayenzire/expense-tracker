version: '3.8'

services:
  db:
    image: postgres:15-alpine
    env_file:
      - ./.env.dev
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    image: ghcr.io/your-github-username/backend:latest
    env_file:
      - ./.env.dev
    environment:
      DJANGO_SETTINGS_MODULE: backend.settings
    expose:
      - "8000"
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery_worker:
    image: ghcr.io/your-github-username/backend:latest
    command: celery -A backend worker --loglevel=info
    env_file:
      - ./.env.dev
    depends_on:
      - db
      - redis
    restart: unless-stopped

  celery_beat:
    image: ghcr.io/your-github-username/backend:latest
    command: celery -A backend beat --loglevel=info
    env_file:
      - ./.env.dev
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    image: ghcr.io/your-github-username/frontend:latest
    expose:
      - "4173"
    depends_on:
      - backend
    restart: unless-stopped

  webserver:
    image: nginx:stable-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  db_data:
  redis_data: