server {
    listen 80;
    server_name _;

    # Security: Block standard/default admin paths
    location = /admin/ {
        return 404;
    }

    location = /admin {
        return 404;
    }

    location = /expense-tracker-control-p92x/ {
        return 404;
    }

    location = /expense-tracker-control-p92x {
        return 404;
    }

    # Custom Django Admin Route
    location /etaalthech2026/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Static Assets (Django collectstatic volume)
    location /static/ {
        alias /app/staticfiles/;
        try_files $uri =404;
    }

    # Media Uploads Volume
    location /media/ {
        alias /app/media/;
        try_files $uri =404;
    }

    # Django REST API Route
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # React Frontend Route
    location / {
        proxy_pass http://frontend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}